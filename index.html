がら解法を見つけていた。",colC:"給食当番の準備を素早く行い、机拭きまで進んで手伝うなど責任感が強い。",colD:"困っている友達に自分から声をかけられる優しい性格。",colE:"高学年になっても周りを気遣えるリーダーとして活躍してほしい。",colF:"算数の学習では、友達と教え合いながら進んで答えを見つけることができました。また、困っている友達に温かく声をかけるなど、優しい思いやりがあふれています。次の学年でも持ち前の良さを十分に発揮し、さらに輝いていくことを期待しています。",charCount:116,status:"completed"},{id:"s-2",colA:"鈴木 葵",colB:"国語の物語文の読解で登場人物の気持ちを深く読み取り、進んで手を挙げて発言した。",colC:"図書係としておすすめの本カードを丁寧に作成し、学級の読書活動を盛り上げた。",colD:"何事にも落ち着いて丁寧に取り組み、最後までやり抜く粘り強さがある。",colE:"自分の考えを堂々と発信し、さらに自信を深めてほしい。",colF:"国語の学習では内容をよく読み取り、自分の考えを堂々と発表することができました。図書係の仕事にも一生懸命取り組み、工夫してみんなを楽しませてくれました。進級後も自分の良いところに自信をもち、堂々と活躍していくことを期待しています。",charCount:114,status:"completed"},{id:"s-3",colA:"高橋 湊",colB:"理科の実験観察に好奇心旺盛。疑問に思ったことを自主的にノートにまとめていた。",colC:"",colD:"落ち着いて座っていられないが、友達思いで優しい。",colE:"じっくり集中できるようになってほしい。",colF:"理科の学習では進んで疑問をもち、夢中になって実験や観察に取り組みました。また、困っている友達に温かく声をかけるなど、優しい思いやりが光っています。今後は授業中に落ち着いてじっくり集中できるように成長していくことを期待しています。",charCount:115,status:"completed"},{id:"s-4",colA:"田中 結菜",colB:"社会科の地域の歴史調べで、写真や図を使って分かりやすく発表できた。",colC:"朝の清掃活動で隅々のホコリまで丁寧に掃き、教室をいつも清潔に保った。",colD:"発表が苦手で声が小さいが、人の話をしっかり聞く優しさがある。",colE:"自信をもって発表してほしい。",colF:"社会科の学習では工夫して調べ、分かりやすくまとめることができました。また、普段から人の話をしっかり聞く優しい思いやりが光っています。今後は自分の思いに自信をもち、みんなの前でも声に出して発表できるように挑戦していくことを期待しています。",charCount:118,status:"completed"},{id:"s-5",colA:"伊藤 翔太",colB:"音楽の合奏で木琴を担当し、リズムに合わせて正確に演奏した。",colC:"",colD:"友達と喧嘩になりやすいが、明るく素直ですぐ仲直りできる。",colE:"友達に優しくできるようになってほしい。",colF:"音楽の授業ではリズムに合わせて演奏し、みんなと音を合わせる楽しさを味わいました。いつも明るく素直な笑顔が素敵です。今後は友達の気持ちに寄り添いながら優しい言葉づかいで過ごせるように、思いやりの心をさらに育てていくことを期待しています。",charCount:119,status:"completed"}],H0={minChars:100,maxChars:120,tone:"polite",omitNameInText:!0,positiveReframing:!0,customPromptAddition:""};async function _0(e){let a=e.map(t=>t.colF||"").join(`

 * 【小学校 通知表・総合所見 自動作成 Google Apps Script】
 * 
 * 使い方:
 * 1. Googleスプレッドシートのメニュー「拡張機能」>「Apps Script」を開きます。
 * 2. 既存のコードを消して、このコードを貼り付けて保存します。
 * 3. スプレッドシートを再読み込みすると「📝通知表所見作成」メニューが表示されます。
 * 4. F列に自動的に100〜120文字程度の温かい総合所見が生成されます。
 */

function onOpen() {
  const ui = SpreadsheetApp.getUi();
  ui.createMenu('📝通知表所見作成')
    .addItem('▶ 選択した行の所見を生成（F列へ）', 'generateSelectedRows')
    .addItem('▶ 全児童の未入力所見を一括生成', 'generateAllEmptyRows')
    .addSeparator()
    .addItem('⚙ APIキーの設定', 'setApiKeyPrompt')
    .addToUi();
}

function setApiKeyPrompt() {
  const ui = SpreadsheetApp.getUi();
  const response = ui.prompt('Gemini APIキーの設定', 'Google AI Studioで取得したAPIキーを入力してください:', ui.ButtonSet.OK_CANCEL);
  if (response.getSelectedButton() === ui.Button.OK) {
    const key = response.getResponseText().trim();
    if (key) {
      PropertiesService.getUserProperties().setProperty('GEMINI_API_KEY', key);
      ui.alert('APIキーを安全に保存しました！');
    }
  }
}

function getApiKey() {
  return PropertiesService.getUserProperties().getProperty('GEMINI_API_KEY');
}

function generateSelectedRows() {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  const range = sheet.getActiveRange();
  const startRow = Math.max(range.getRow(), 2); // 1行目は見出し
  const numRows = range.getNumRows();

  processRows(sheet, startRow, startRow + numRows - 1);
}

function generateAllEmptyRows() {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  const lastRow = sheet.getLastRow();
  if (lastRow < 2) {
    SpreadsheetApp.getUi().alert('データ行がありません。');
    return;
  }
  processRows(sheet, 2, lastRow, true);
}

function processRows(sheet, startRow, endRow, onlyEmpty = false) {
  const apiKey = getApiKey();
  if (!apiKey) {
    SpreadsheetApp.getUi().alert('APIキーが設定されていません。「📝通知表所見作成」>「⚙ APIキーの設定」から入力してください。');
    return;
  }

  for (let r = startRow; r <= endRow; r++) {
    const colA = sheet.getRange(r, 1).getValue(); // 氏名
    const colB = sheet.getRange(r, 2).getValue(); // 学習の様子
    const colC = sheet.getRange(r, 3).getValue(); // 生活の様子
    const colD = sheet.getRange(r, 4).getValue(); // 行動・特記事項
    const colE = sheet.getRange(r, 5).getValue(); // その他メモ
    const currentF = sheet.getRange(r, 6).getValue(); // 総合所見

    if (onlyEmpty && currentF && String(currentF).trim() !== '') {
      continue;
    }
    if (!colA && !colB && !colC) continue;

    sheet.getRange(r, 6).setValue('⏳ 生成中...');
    SpreadsheetApp.flush();

    try {
      const remark = callGeminiForRemark(apiKey, colA, colB, colC, colD, colE);
      sheet.getRange(r, 6).setValue(remark);
    } catch (err) {
      sheet.getRange(r, 6).setValue('⚠️ エラー: ' + err.message);
    }
  }
  SpreadsheetApp.getUi().alert('所見の生成が完了しました！');
}

function callGeminiForRemark(apiKey, colA, colB, colC, colD, colE) {
  const prompt = \`あなたは小学校の教員です。通知表の所見を作成してください。

【条件】
・文字数は100〜120文字程度。
・丁寧で温かい表現（〜です、〜ます調）。
・ネガティブなことは肯定的に言い換える。
・「氏名」は本人確認用です。所見の中で名前を呼ぶ必要はありません。

【対象児童のメモ】
氏名：\${colA || '児童'}
学習の様子：\${colB || 'なし'}
生活の様子：\${colC || 'なし'}
行動・特記事項：\${colD || 'なし'}
その他メモ：\${colE || 'なし'}

【出力】
所見の文章のみを出力してください。\`;

  const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=' + apiKey;
  const payload = {
    contents: [{ parts: [{ text: prompt }] }]
  };
  const options = {
    method: 'post',
    contentType: 'application/json',
    payload: JSON.stringify(payload),
    muteHttpExceptions: true
  };

  const response = UrlFetchApp.fetch(url, options);
  const json = JSON.parse(response.getContentText());
  if (json.candidates && json.candidates[0]?.content?.parts[0]?.text) {
    return json.candidates[0].content.parts[0].text.trim();
  }
  throw new Error('APIの応答が不正です');
